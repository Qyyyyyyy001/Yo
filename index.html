<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yang Qiu · Portfolio 2026</title>
<link rel="stylesheet" href="apple-design-system.css">
<style>
    body {
        margin: 0;
        background: var(--bg-primary, #f5f5f7);
    }
    .hero {
        text-align: center;
        padding: 64px 24px 32px;
        max-width: 880px;
        margin: 0 auto;
    }
    .hero h1 {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
        color: var(--text-primary, #1d1d1f);
    }
    .hero p {
        font-size: 19px;
        color: var(--text-secondary, #6e6e73);
        margin: 0 0 28px;
    }
    .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 40px;
    }
    .viewer-wrap {
        max-width: 1120px;
        margin: 0 auto 64px;
        padding: 0 24px;
    }
    .viewer {
        width: 100%;
        height: 86vh;
        min-height: 640px;
        border: 0;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        background: #fff;
        display: block;
    }
    .fallback {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-secondary, #6e6e73);
        font-size: 15px;
    }
    footer {
        text-align: center;
        padding: 32px 24px 48px;
        font-size: 13px;
        color: var(--text-secondary, #6e6e73);
    }
    footer a {
        color: var(--apple-blue, #007aff);
        text-decoration: none;
    }
    @media (max-width: 640px) {
        .hero { padding: 40px 20px 24px; }
        .hero h1 { font-size: 32px; }
        .hero p { font-size: 16px; }
        .viewer { height: 70vh; min-height: 480px; border-radius: 14px; }
    }
</style>
</head>
<body>

<section class="hero">
    <h1>Yang Qiu</h1>
    <p>Portfolio · 2026</p>
    <div class="actions">
        <a class="apple-btn apple-btn-primary" href="portfolio.pdf" target="_blank" rel="noopener">在新标签打开</a>
        <a class="apple-btn apple-btn-secondary" href="portfolio.pdf" download="Yang-Qiu-Portfolio-2026.pdf">下载 PDF</a>
    </div>
</section>

<div class="viewer-wrap">
    <object class="viewer" data="portfolio.pdf" type="application/pdf">
        <iframe class="viewer" src="portfolio.pdf" title="Yang Qiu Portfolio 2026"></iframe>
        <div class="fallback">
            你的浏览器无法嵌入预览 PDF。请点击上方"在新标签打开"或"下载 PDF"。
        </div>
    </object>
</div>

<footer>
    © 2026 Yang Qiu · <a href="design-system.html">Design System</a>
</footer>

</body>
</html>
